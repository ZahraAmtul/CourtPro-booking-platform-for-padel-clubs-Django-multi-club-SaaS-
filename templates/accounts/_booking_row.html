{% load club %}<a class="card list-card" href="{% url 'bookings:detail' b.reference %}" style="color:inherit;text-decoration:none">
  <div>
    <strong>{{ b.court.name }} · {{ b.start_at|date:"D j M" }}, {{ b.start_at|time:"g:i A" }}</strong>
    <div class="muted small">{{ b.duration_minutes|duration }} · Ref <span class="mono">{{ b.reference }}</span>{% if b.invoice %} · {{ b.invoice.total|money }}{% endif %}</div>
  </div>
  <span class="badge badge-{{ b.status_color }}">{{ b.get_status_display }}</span>
</a>
