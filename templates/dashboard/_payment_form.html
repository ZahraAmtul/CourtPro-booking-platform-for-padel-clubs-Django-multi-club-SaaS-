<div class="panel">
  <div class="panel-head"><h3>Record payment</h3></div>
  <form method="post" action="{% url 'dashboard:invoice_payment' invoice.pk %}" class="panel-body form">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div class="form-grid">
      {% include "partials/field.html" with field=payment_form.amount %}
      {% include "partials/field.html" with field=payment_form.method %}
    </div>
    {% include "partials/field.html" with field=payment_form.reference %}
    <button class="btn btn-blue btn-block">Record payment</button>
  </form>
</div>
