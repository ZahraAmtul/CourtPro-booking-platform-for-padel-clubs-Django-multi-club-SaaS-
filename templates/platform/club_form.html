{% extends "platform/base.html" %}
{% block content %}
<div class="narrow" style="padding:2rem 0;width:min(640px,100% - 2.5rem)">
  <a href="{% url 'platform_admin' %}">← Clubs</a>
  <h1 style="font-size:1.6rem;margin-top:.5rem">{{ club.name }}</h1>
  <p class="muted">{{ club.host }} · created {{ club.created_at|date:"j M Y" }}</p>
  <form method="post" class="card form">{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-blue">Save</button>
  </form>
</div>
{% endblock %}
