<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to {{ gateway }}…</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f6f8fb;color:#0f172a}</style>
</head><body>
<form id="gw" method="post" action="{{ action }}">
  {% for name, value in fields.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
  <p>Taking you to {{ gateway }} to complete your payment…</p>
  <noscript><button type="submit">Continue to {{ gateway }}</button></noscript>
</form>
<script>document.getElementById('gw').submit();</script>
</body></html>
